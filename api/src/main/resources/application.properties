# Profil actif (dev par défaut)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuration commune
server.port=8080
spring.application.name=restaurant-api

# CORS - Autoriser Flutter (localhost et émulateurs)
spring.web.cors.allowed-origins=http://localhost:*,http://10.0.2.2:*,http://127.0.0.1:*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Configuration base de données (profil dev)
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
